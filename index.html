let currentIndex = 0;
let userAnswers = new Array(questions.length).fill(null);

// ==========================================
// 2. RENDER SINGLE QUESTION & PALETTE
// ==========================================
function renderQuestion(index) {
    const container = document.getElementById("question-container");
    const item = questions[index];
    
    let html = `<div class="q-title">${item.q}</div>`;
    item.options.forEach((opt, optIdx) => {
        const isChecked = userAnswers[index] === optIdx ? "checked" : "";
        const selectedClass = userAnswers[index] === optIdx ? "selected" : "";
        html += `<label class="opt-label ${selectedClass}">
            <input type="radio" name="current_q" value="${optIdx}" ${isChecked} onchange="selectOption(${index}, ${optIdx})">
            ${opt}
        </label>`;
    });

    container.innerHTML = html;

    document.getElementById("btn-prev").disabled = index === 0;
    
    const nextBtn = document.getElementById("btn-next");
    if (index === questions.length - 1) {
        nextBtn.innerText = "Review & Submit";
        nextBtn.className = "btn btn-submit";
        nextBtn.onclick = openPreview;
    } else {
        nextBtn.innerText = "Next";
        nextBtn.className = "btn btn-next";
        nextBtn.onclick = () => changeQuestion(1);
    }

    renderPalette();
}

function selectOption(qIdx, optIdx) {
    userAnswers[qIdx] = optIdx;
    renderQuestion(qIdx);
}

function changeQuestion(step) {
    currentIndex += step;
    if (currentIndex < 0) currentIndex = 0;
    if (currentIndex >= questions.length) currentIndex = questions.length - 1;
    renderQuestion(currentIndex);
}

function jumpToQuestion(idx) {
    currentIndex = idx;
    closePreview();
    renderQuestion(currentIndex);
}

function renderPalette() {
    const grid = document.getElementById("palette-grid");
    grid.innerHTML = "";
    
    questions.forEach((_, idx) => {
        let box = document.createElement("div");
        box.className = "q-box";
        if (idx === currentIndex) box.classList.add("active");
        if (userAnswers[idx] !== null) box.classList.add("answered");
        
        box.innerText = idx + 1;
        box.onclick = () => jumpToQuestion(idx);
        grid.appendChild(box);
    });
}

// ==========================================
// 3. PREVIEW DRAWER (SHOWS ALL QUESTIONS GREEN/RED)
// ==========================================
function openPreview() {
    document.getElementById("quiz-portal").style.display = "none";
    document.getElementById("preview-modal").style.display = "block";
    
    let answeredCount = userAnswers.filter(a => a !== null).length;
    let unattemptedCount = questions.length - answeredCount;
    
    document.getElementById("preview-summary").innerHTML = 
        `You have answered <strong>${answeredCount}</strong> out of <strong>${questions.length}</strong> questions. (${unattemptedCount} remaining)`;
    
    const listDiv = document.getElementById("all-questions-list");
    let tagsHtml = "";

    userAnswers.forEach((ans, idx) => {
        if (ans !== null) {
            tagsHtml += `<span class="q-tag q-tag-answered" onclick="jumpToQuestion(${idx})">Q${idx + 1} ✓</span>`;
        } else {
            tagsHtml += `<span class="q-tag q-tag-unanswered" onclick="jumpToQuestion(${idx})">Q${idx + 1}</span>`;
        }
    });

    listDiv.innerHTML = tagsHtml;
}

function closePreview() {
    document.getElementById("preview-modal").style.display = "none";
    document.getElementById("quiz-portal").style.display = "grid";
}

// ==========================================
// 4. TIMER LOGIC
// ==========================================
const TOTAL_TIME = 3600; // 60 minutes
let timeLeft = TOTAL_TIME;
const timerDisplay = document.getElementById("timer");

const timerInterval = setInterval(() => {
    let mins = Math.floor(timeLeft / 60);
    let secs = timeLeft % 60;
    timerDisplay.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    
    if (timeLeft <= 0) {
        clearInterval(timerInterval);
        alert("Time is up! Submitting test automatically.");
        submitQuiz();
    }
    timeLeft--;
}, 1000);

// ==========================================
// 5. AUTO-GRADING & SOLUTIONS REVIEW GENERATION
// ==========================================
function submitQuiz() {
    clearInterval(timerInterval);
    
    document.getElementById("quiz-portal").style.display = "none";
    document.getElementById("preview-modal").style.display = "none";
    
    let timeTakenSeconds = TOTAL_TIME - timeLeft;
    let timeMins = Math.floor(timeTakenSeconds / 60);
    let timeSecs = timeTakenSeconds % 60;
    let formattedTime = `${timeMins} min ${timeSecs < 10 ? '0' : ''}${timeSecs} sec`;

    let attempted = 0;
    let correct = 0;
    let wrong = 0;

    questions.forEach((item, idx) => {
        if (userAnswers[idx] !== null) {
            attempted++;
            if (userAnswers[idx] === item.answer) {
                correct++;
            } else {
                wrong++;
            }
        }
    });

    let unattempted = questions.length - attempted;
    let scorePercentage = Math.round((correct / questions.length) * 100);

    // Build Solutions Review Section
    let reviewHtml = `<div class="review-section"><h2>🔍 Detailed Question & Answer Review</h2>`;
    
    questions.forEach((item, idx) => {
        let userAns = userAnswers[idx];
        let isCorrect = userAns === item.answer;
        let isSkipped = userAns === null;

        let cardClass = isSkipped ? "skipped-border" : (isCorrect ? "correct-border" : "wrong-border");
        let badgeHtml = isSkipped 
            ? `<span class="badge badge-skipped">Skipped</span>`
            : (isCorrect ? `<span class="badge badge-correct">✓ Correct</span>` : `<span class="badge badge-wrong">✗ Incorrect</span>`);

        reviewHtml += `
            <div class="review-card ${cardClass}">
                ${badgeHtml}
                <div style="font-weight:600; margin-bottom:10px;">${item.q}</div>
        `;

        item.options.forEach((opt, optIdx) => {
            let optClass = "review-neutral";
            let labelText = opt;

            if (optIdx === item.answer) {
                optClass = "review-correct";
                labelText += " (Correct Answer)";
            }
            if (userAns === optIdx && !isCorrect) {
                optClass = "review-wrong";
                labelText += " (Your Selection)";
            }

            reviewHtml += `<div class="review-opt ${optClass}">${labelText}</div>`;
        });

        reviewHtml += `</div>`;
    });
    
    reviewHtml += `</div>`;

    // Render Stats + Review
    const resultBox = document.getElementById("result-box");
    resultBox.style.display = "block";
    resultBox.innerHTML = `
        <h2 style="margin-top:0;">📊 Test Summary Report</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <div>Total Questions</div>
                <div class="stat-value">${questions.length}</div>
            </div>
            <div class="stat-card">
                <div>Time Taken</div>
                <div class="stat-value stat-time">${formattedTime}</div>
            </div>
            <div class="stat-card">
                <div>Attempted</div>
                <div class="stat-value">${attempted} / ${questions.length}</div>
            </div>
            <div class="stat-card">
                <div>Unattempted</div>
                <div class="stat-value stat-unattempted">${unattempted}</div>
            </div>
            <div class="stat-card">
                <div>Correct Answers</div>
                <div class="stat-value stat-correct">${correct}</div>
            </div>
            <div class="stat-card">
                <div>Wrong Answers</div>
                <div class="stat-value stat-wrong">${wrong}</div>
            </div>
        </div>
        <div style="margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; text-align: center;">
            <span style="font-size: 18px;">Final Score: </span>
            <span class="stat-value stat-score">${correct} / ${questions.length} (${scorePercentage}%)</span>
        </div>
        ${reviewHtml}
    `;
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initial Launch
renderQuestion(0);
</script>
