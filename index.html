        .controls { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        .btn { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
        .btn-prev { background: #6c757d; color: white; }
        .btn-next { background: #0d6efd; color: white; }
        .btn-submit { background: #198754; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
        .p-btn { padding: 10px 0; text-align: center; border: 1px solid #ccc; background: #e9ecef; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .p-btn.active { border: 2px solid #0d6efd; background: #eef5ff; }
        .p-btn.answered { background: #198754; color: white; border-color: #198754; }
        
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 15px; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; max-width: 500px; width: 100%; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0 25px 0; }
        .stat-card { background: #f8f9fa; padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; }
        .stat-value { font-size: 1.5rem; margin-bottom: 5px; }
        .stat-score { color: #0d6efd; }
        .stat-correct { color: #198754; }
        .stat-wrong { color: #dc3545; }
        .stat-unattempted { color: #6c757d; }

        .review-section { margin-top: 25px; border-top: 2px solid #e0e0e0; padding-top: 20px; }
        .review-card { background: #fdfdfd; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        .review-card.correct-card { border-left: 5px solid #198754; }
        .review-card.wrong-card { border-left: 5px solid #dc3545; }
        .review-card.unattempted-card { border-left: 5px solid #6c757d; }
        .review-q-title { font-weight: bold; margin-bottom: 10px; }
        .review-opt { padding: 8px 12px; margin: 4px 0; border-radius: 4px; background: #f1f1f1; font-size: 0.95rem; }
        .review-opt.user-correct { background: #d1e7dd; color: #0f5132; font-weight: bold; border: 1px solid #badbcc; }
        .review-opt.user-wrong { background: #f8d7da; color: #842029; font-weight: bold; border: 1px solid #f5c2c7; }
        .review-opt.is-actual-correct { background: #d1e7dd; color: #0f5132; font-weight: bold; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: white; margin-left: 10px; }

        .badge-wrong { background-color: #dc3545; }
        .badge-unattempted { background-color: #6c757d; }

</head>

let questions = [];
let currentQIdx = 0;
let userAnswers = [];
let timeLeft = 3600;
let timerInterval;

function normalizeOptions(optionsData) {
    if (Array.isArray(optionsData)) return optionsData;
    if (typeof optionsData === 'object' && optionsData !== null) return Object.values(optionsData);
    return [];
}

function initPortal() {
    if (!Array.isArray(rawQuestions) || rawQuestions.length === 0) {
        document.getElementById("question-container").innerHTML = "<p style='color:red;'><b>Error:</b> JSON dataset is empty or formatted incorrectly.</p>";
        return;
    }

    questions = rawQuestions.map(q => ({
        id: q.id,
        options: normalizeOptions(q.options),
        answer: String(q.answer)
    }));

    userAnswers = new Array(questions.length).fill(null);

    startTimer();
    renderQuestion(0);
}

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        const timeElement = document.getElementById("time-display");
        if (timeElement) {
            timeElement.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            submitQuiz();
        }
    }, 1000);
}

function renderQuestion(index) {
    const container = document.getElementById("question-container");
    const item = questions[index];
    
    let html = `<div class="q-number-header">Question No. ${index + 1}</div>`;
    
    item.options.forEach((optText, optIdx) => {
        const optionKey = (optIdx + 1).toString();
        const isChecked = userAnswers[index] === optionKey ? "checked" : "";
        const selectedClass = userAnswers[index] === optionKey ? "selected" : "";
        
        html += `<label class="opt-label ${selectedClass}">
            <input type="radio" name="current_q" value="${optionKey}" ${isChecked} onchange="selectOption(${index}, '${optionKey}')">
            ${optIdx + 1}. ${optText}
        </label>`;
    });

    container.innerHTML = html;

    document.getElementById("btn-prev").disabled = index === 0;
    
    const nextBtn = document.getElementById("btn-next");
    if (index === questions.length - 1) {
        nextBtn.innerText = "Review & Submit";
        nextBtn.className = "btn btn-submit";
        nextBtn.onclick = openPreview;
    } else {
        nextBtn.innerText = "Next";
        nextBtn.className = "btn btn-next";
        nextBtn.onclick = () => changeQuestion(1);
    }

    renderPalette();
}

function selectOption(qIdx, optKey) {
    userAnswers[qIdx] = optKey;
    renderQuestion(qIdx);
}

function changeQuestion(step) {
    currentQIdx += step;
    if (currentQIdx < 0) currentQIdx = 0;
    if (currentQIdx >= questions.length) currentQIdx = questions.length - 1;
    renderQuestion(currentQIdx);
}

function renderPalette() {
    const paletteGrid = document.getElementById("palette-grid");
    paletteGrid.innerHTML = "";
    
    questions.forEach((_, idx) => {
        const btn = document.createElement("div");
        btn.className = `p-btn ${idx === currentQIdx ? 'active' : ''} ${userAnswers[idx] !== null ? 'answered' : ''}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
            currentQIdx = idx;
            renderQuestion(currentQIdx);
        };
        paletteGrid.appendChild(btn);
    });
}

function openPreview() {
    document.getElementById("preview-modal").style.display = "flex";
}

function closePreview() {
    document.getElementById("preview-modal").style.display = "none";
}

function submitQuiz() {
    clearInterval(timerInterval);
    document.getElementById("quiz-portal").style.display = "none";
    document.getElementById("preview-modal").style.display = "none";
    
    let score = 0;
    let correct = 0;
    let wrong = 0;
    let unattempted = 0;

    let reviewHtml = `<div class="review-section"><h3>Answer Key & Performance Breakdown</h3>`;

    questions.forEach((q, idx) => {
        const userAns = userAnswers[idx];
        const correctAns = q.answer;
        let cardClass = "";
        let badgeHtml = "";

        if (userAns === null) {
            unattempted++;
            cardClass = "unattempted-card";
            badgeHtml = `<span class="badge badge-unattempted">Unattempted</span>`;
        } else if (userAns === correctAns) {
            correct++;
            score += 2;
            cardClass = "correct-card";
            badgeHtml = `<span class="badge badge-correct">Correct (+2)</span>`;
        } else {
            wrong++;
            cardClass = "wrong-card";
            badgeHtml = `<span class="badge badge-wrong">Incorrect</span>`;
        }

        reviewHtml += `<div class="review-card ${cardClass}">
            <div class="review-q-title">Question No. ${idx + 1} ${badgeHtml}</div>`;

        q.options.forEach((optText, optIdx) => {
            const optionKey = (optIdx + 1).toString();
            let optClass = "review-opt";

            if (userAns === optionKey && userAns === correctAns) {
                optClass += " user-correct";
            } else if (userAns === optionKey && userAns !== correctAns) {
                optClass += " user-wrong";
            } else if (optionKey === correctAns) {
                optClass += " is-actual-correct";
            }

            let appendLabel = "";
            if (userAns === optionKey && userAns === correctAns) {
                appendLabel = " <b>— Your Answer (Correct)</b>";
            } else if (userAns === optionKey && userAns !== correctAns) {
                appendLabel = " <b>— Your Answer (Wrong)</b>";
            } else if (optionKey === correctAns) {
                appendLabel = " <b>— Correct Answer</b>";
            }

            reviewHtml += `<div class="${optClass}">${optIdx + 1}. ${optText}${appendLabel}</div>`;
        });

        reviewHtml += `</div>`;
    });

    reviewHtml += `</div>`;

    const resultBox = document.getElementById("result-box");
    resultBox.style.display = "block";
    resultBox.innerHTML = `
        <h2>Exam Results</h2>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value stat-score">${score} / ${questions.length * 2}</div>Total Marks</div>
            <div class="stat-card"><div class="stat-value stat-correct">${correct}</div>Correct</div>
            <div class="stat-card"><div class="stat-value stat-wrong">${wrong}</div>Incorrect</div>
            <div class="stat-card"><div class="stat-value stat-unattempted">${unattempted}</div>Unattempted</div>
        </div>
        ${reviewHtml}
    `;
}

document.addEventListener("DOMContentLoaded", initPortal);
</script>
